{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8fa">
    <title>{% block title %}ChatGemini{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'ask' %}">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>Chat<span class="brand-accent">Gemini</span></span>
        </a>
        <nav class="auth-nav">
            {% if user.is_authenticated %}
                <span class="username">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="inline-form">
                    {% csrf_token %}
                    <button class="logout-button" type="submit" title="Выйти из аккаунта" aria-label="Выйти из аккаунта">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3m9-8h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg>
                        <span>Выйти</span>
                    </button>
                </form>
            {% else %}
                <a class="button" href="{% url 'login' %}">Войти</a>
            {% endif %}
        </nav>
    </header>
    <main class="container {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
