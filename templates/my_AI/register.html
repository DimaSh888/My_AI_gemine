{% extends 'base.html' %}

{% block title %}Register — ChatGemini{% endblock %}

{% block content %}
<section class="panel">
    <h1>Register</h1>
    <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Sign up</button>
    </form>
    <p class="form-footer">Have you an account? <a href="{% url 'login' %}">Sign in</a></p>
</section>
{% endblock %}
